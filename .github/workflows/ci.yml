name: Continuous Integration Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci
          cd ..

      - name: Run Linter Validation
        run: npm run lint
        continue-on-error: true

      - name: Validate Production Build
        run: npm run build

      - name: Execute Automated Test Suite
        run: npm test
        env:
          NODE_ENV: test
          DB_ENGINE: sqlite
          SQLITE_PATH: ':memory:'
          JWT_SECRET: ci_pipeline_super_secret_test_jwt_key_2026

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-results-node-${{ matrix.node-version }}
          path: |
            dist/
          retention-days: 7
